---
- name: Install Calico
  hosts: server
  become: true

  tasks:
    - name: Install Tigera Operator
      run_once: true
      ansible.builtin.command:
        cmd: >-
          kubectl apply -f
          https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml

    - name: Render custom resources
      ansible.builtin.template:
        src: ../templates/custom-resources.yaml.j2
        dest: /tmp/custom-resources.yaml

    - name: Install Calico custom resources
      run_once: true
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/custom-resources.yaml

    - name: Wait for all nodes to become Ready
      run_once: true
      ansible.builtin.command:
        cmd: >-
          kubectl wait
          --for=condition=Ready
          node
          --all
          --timeout=300s