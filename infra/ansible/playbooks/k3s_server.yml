---
- name: Setup k3s
  hosts: server
  become: true
  tasks:
    - name: Install the k3s server on the control-plane
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --flannel-backend=none --cluster-init --tls-san={{ hostvars['control_plane']['ansible_host'] }}" sh -
      args:
        creates: /usr/local/bin/k3s  # skips the task if the file already exists

    - name: Wait for k3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      retries: 10
      delay: 10
      register: result
      until: result.rc == 0
